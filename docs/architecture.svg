<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <title>relmw-qnx architecture</title>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold">relmw-qnx: reliability supervisor on QNX OS 8.0</text>
  <!-- operators -->
  <rect x="30" y="60" width="250" height="110" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="155" y="82" text-anchor="middle" font-weight="bold">Operators / HMI / scripts</text>
  <text x="45" y="105">$ cat /dev/relmw/status</text>
  <text x="45" y="125">$ cat /dev/relmw/events</text>
  <text x="45" y="145">$ echo "fault percep_bias" &gt; /dev/relmw/ctl</text>
  <text x="45" y="162" font-size="11" fill="#555">(scripts/relmwctl wraps these)</text>
  <!-- HAM -->
  <rect x="680" y="60" width="250" height="110" rx="8" fill="#fde9e7" stroke="#b03a2e"/>
  <text x="805" y="82" text-anchor="middle" font-weight="bold">HAM (High Availability Manager)</text>
  <text x="692" y="105" font-size="12">CONDDEATH → restart action</text>
  <text x="692" y="125" font-size="12">heartbeat entity relmw_supervisor_hb</text>
  <text x="692" y="145" font-size="12">missed high → slay own pid → restart</text>
  <text x="692" y="162" font-size="11" fill="#555">apps/relmw_ham_setup.cpp, qnx_timer.cpp</text>
  <!-- supervisor process -->
  <rect x="30" y="200" width="900" height="300" rx="10" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="45" y="222" font-weight="bold" fill="#1f4e79">relmw_supervisor process (apps/relmw_supervisor.cpp)</text>
  <!-- resmgr thread -->
  <rect x="50" y="240" width="270" height="120" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="185" y="260" text-anchor="middle" font-weight="bold">Resource manager thread</text>
  <text x="62" y="282">resmgr_attach /dev/relmw/{status,</text>
  <text x="62" y="300">events,ctl}; io_read / io_write</text>
  <text x="62" y="318">dispatch_block → dispatch_handler</text>
  <text x="62" y="348" font-size="11" fill="#555">src/platform/qnx/qnx_resmgr.cpp</text>
  <!-- control thread -->
  <rect x="345" y="240" width="300" height="240" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="495" y="260" text-anchor="middle" font-weight="bold" font-size="12">Control thread (SCHED_FIFO / SPORADIC)</text>
  <text x="357" y="282">timer_create(CLOCK_MONOTONIC)</text>
  <text x="357" y="300">  → SIGEV_PULSE (explicit priority)</text>
  <text x="357" y="318">  → MsgReceivePulse on private channel</text>
  <text x="357" y="342" font-weight="bold">ReliabilityMiddleware::run()</text>
  <text x="357" y="360">sub-task → verifier (settle + hold)</text>
  <text x="357" y="378">fail → classify → correlated? → rollback</text>
  <text x="357" y="396">robot only → CorrelationAwareRetry</text>
  <text x="357" y="414">(never repeat a failed strategy)</text>
  <text x="357" y="432">→ ladder exhausted → escalate to human</text>
  <text x="357" y="452">release latency histogram (O(1), no alloc)</text>
  <text x="357" y="470" font-size="10" fill="#555">src/core/middleware.cpp, retry_policy.cpp, latency.cpp</text>
  <!-- logging + library -->
  <rect x="670" y="240" width="240" height="100" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="790" y="260" text-anchor="middle" font-weight="bold">slog2 buffer "relmw"</text>
  <text x="682" y="282">slog2_register / vslog2f</text>
  <text x="682" y="300">$ slog2info -b relmw</text>
  <text x="682" y="328" font-size="11" fill="#555">src/platform/qnx/qnx_log.cpp</text>
  <rect x="670" y="355" width="240" height="125" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="790" y="375" text-anchor="middle" font-weight="bold">Failure library</text>
  <text x="682" y="397">(sub-task, mode, strategy) →</text>
  <text x="682" y="415">successes / tries, Beta prior</text>
  <text x="682" y="433">saved atomically after each episode,</text>
  <text x="682" y="451">reloaded after a HAM restart</text>
  <rect x="50" y="375" width="270" height="105" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="185" y="395" text-anchor="middle" font-weight="bold">RobotAdapter</text>
  <text x="62" y="417">get_obs / step / move_robot_to</text>
  <text x="62" y="435">today: deterministic PushSim2D</text>
  <text x="62" y="453">next: driver process /dev/robot0</text>
  <text x="62" y="471" font-size="11" fill="#555">include/relmw/robot.hpp, src/core/sim2d.cpp</text>
  <!-- arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <line x1="155" y1="170" x2="155" y2="238" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="162" y="195" font-size="11">open/read/write = QNX messages</text>
  <line x1="320" y1="300" x2="343" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="645" y1="290" x2="668" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="645" y1="410" x2="668" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="343" y1="430" x2="322" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="805" y1="170" x2="805" y2="238" stroke="#b03a2e" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- footer: portability -->
  <rect x="30" y="520" width="900" height="60" rx="8" fill="#f7f7f7" stroke="#999"/>
  <text x="45" y="542" font-size="12"><tspan font-weight="bold">Portable core</tspan> (src/core, no OS calls) same sources for Linux (g++/clang, tested) and QNX (q++, first build pending SDP); own RNG → bit-identical results.</text>
  <text x="45" y="565" font-size="12"><tspan font-weight="bold">Platform layer</tspan>: src/platform/qnx (QNX 8.0) or src/platform/posix (Linux host baseline: clock_nanosleep, FIFO, stderr).</text>
</svg>
